[workspace]
resolver = "2"
members = ["crates/owlet-core", "crates/owlet-cli", "crates/owlet-gpui"]
# WASM plugins target wasm32-wasip2 and are built independently (see their
# Cargo.toml). Keeping them out of the workspace stops a native `cargo build`
# at the root from trying to compile their cdylib crates for the host target.
exclude = ["plugins/echo", "plugins/aws"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false, features = [
    "std",
] }
parking_lot = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "stream",
] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
wasmtime = { version = "50.0.0", default-features = false, features = [
    "anyhow",
    "cranelift",
    "runtime",
    "component-model",
    "gc-drc",
] }
wasmtime-wasi = "50.0.0"
nix = { version = "0.31.3", features = ["signal"] }
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
