[package]
name = "owlet"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
parking_lot = "0.12.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
tar = "0.4.46"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.6"
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v4"] }

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["signal"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
