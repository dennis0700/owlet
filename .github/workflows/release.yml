name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Every action pinned below declares `using: node24` (or is composite). This
  # also forces any Node 20 action that slips in onto Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ZIG_VERSION: 0.17.0
  ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
  CARGO_ZIGBUILD_VERSION: 0.23.4

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            plugins/aws

      - name: Rebuild aws-mcp fixture from source
        working-directory: plugins/aws
        run: |
          cargo build --locked --release --target wasm32-wasip2
          cp target/wasm32-wasip2/release/owlet_plugin_aws_mcp.wasm ../../tests/fixtures/aws-mcp.wasm

      - run: cargo clippy --locked --all-targets --workspace --exclude owlet-gpui -- -D warnings
      - run: cargo test --locked --workspace --exclude owlet-gpui

      - name: Test aws-mcp plugin
        working-directory: plugins/aws
        run: cargo test --locked

  build-plugins:
    name: plugins (wasm32-wasip2)
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/aws

      - name: Build aws-mcp
        working-directory: plugins/aws
        run: cargo build --locked --release --target wasm32-wasip2

      - name: Package
        run: |
          name=owlet-plugin-aws-mcp.wasm
          mkdir -p dist-plugins
          cp plugins/aws/target/wasm32-wasip2/release/owlet_plugin_aws_mcp.wasm "dist-plugins/${name}"
          (cd dist-plugins && sha256sum "${name}" > "${name}.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: owlet-plugins
          path: dist-plugins/*
          if-no-files-found: error

  build-linux:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install zig
        run: |
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/zig"
          tar -xJf zig.tar.xz -C "${RUNNER_TEMP}/zig" --strip-components=1
          rm zig.tar.xz
          echo "${RUNNER_TEMP}/zig" >> "${GITHUB_PATH}"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}

      - name: Build
        run: cargo zigbuild --locked --release -p owlet-cli --target ${{ matrix.target }}

      - name: Verify static binary
        run: |
          bin="target/${{ matrix.target }}/release/owlet"
          file "${bin}"
          file "${bin}" | grep -q "statically linked"

      - uses: ./.github/actions/package
        with:
          target: ${{ matrix.target }}

  build-macos:
    name: build (aarch64-apple-darwin)
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin

      - name: Build
        run: cargo build --locked --release -p owlet-cli --target aarch64-apple-darwin

      - uses: ./.github/actions/package
        with:
          target: aarch64-apple-darwin

  build-ui:
    name: ui (aarch64-apple-darwin)
    needs: check
    runs-on: macos-15
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      - name: Test
        run: cargo test --locked -p owlet-gpui --target ${{ env.TARGET }}

      - name: Build
        run: cargo build --locked --release -p owlet-gpui --target ${{ env.TARGET }}

      # Ad-hoc signed Owlet.app inside a drag-to-Applications .dmg. The
      # updater looks for exactly this `owlet-ui-<tag>-<target>.dmg` name.
      - name: Package
        run: |
          name="owlet-ui-${GITHUB_REF_NAME}-${TARGET}"
          crates/owlet-gpui/bundle-macos.sh "target/${TARGET}/release/owlet-gpui" "${GITHUB_REF_NAME#v}" dist-ui
          mv dist-ui/Owlet.dmg "dist-ui/${name}.dmg"
          (cd dist-ui && shasum -a 256 "${name}.dmg" > "${name}.dmg.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: owlet-ui-${{ env.TARGET }}
          path: |
            dist-ui/*.dmg
            dist-ui/*.sha256
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.target }})
    needs: [build-linux, build-macos]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: owlet-${{ matrix.target }}

      - name: Run packaged binary
        shell: bash
        run: |
          tar -xzf owlet-*.tar.gz
          ./owlet-*/owlet --version
          ./owlet-*/owlet --help > /dev/null

  release:
    needs: [smoke, build-ui, build-plugins]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.dmg
            dist/*.wasm
            dist/*.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
