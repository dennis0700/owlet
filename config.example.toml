# Copy to ~/.config/owlet/config.toml
listen = "127.0.0.1:8808"
# Or set $OWLET_TOKEN. Required when listening on a non-loopback address.
token = "change-me"
idle_timeout = 600      # stop an upstream process after N idle seconds
session_ttl = 86400     # forget a client session after N idle seconds
request_timeout = 300

# Stateless: one process shared by every client.
[servers.fetch]
command = "uvx"
args = ["mcp-server-fetch"]

# Per project: one process per ?project=<abs path>, started with that cwd.
[servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]
scope = "project"

# WASM plugin: a WebAssembly component (exporting `handle` and `on-shutdown`)
# loaded in-process. No external runtime needed; `scope` may be "shared" or "session".
[servers.echo]
wasm = "~/.config/owlet/plugins/echo.wasm"

# AWS MCP via the aws-mcp plugin, replacing
# `uvx mcp-proxy-for-aws@1.6.3 https://aws-mcp.us-east-1.api.aws/mcp --metadata AWS_REGION=us-west-2`.
# A plugin only gets what is granted here: WASI argv (`args`), environment
# (`env` plus host variables matched by `inherit_env`) and read-only `dirs`.
# Its only network access is owlet's HTTP import; WASI sockets stay disabled.
# That import reaches any http(s) URL, so only load plugins you trust.
# An instance handles one message at a time; "session" scope avoids queueing
# clients behind each other's slow calls.
# Credentials (AWS SDK chain): env keys, `~/.aws` profiles (static keys, role_arn
# with source_profile / credential_source = Environment, web_identity_token_file;
# the token file must be inside `dirs`), env web identity and ECS container
# credentials.
# credential_process (WASI cannot start processes), mfa_serial, SSO / IAM
# Identity Center profiles and IMDS are not supported.
# Add "--read-only" to expose only read-only tools, and "--profile", "a", "b"
# (or AWS_MCP_PROXY_PROFILES="a b") to let auth tools take an `aws_profile` argument.
# `owlet plugin install aws-mcp` downloads the plugin and adds this entry for you.
# [servers.aws-mcp]
# wasm = "~/.config/owlet/plugins/aws-mcp.wasm"
# args = ["https://aws-mcp.us-east-1.api.aws/mcp", "--metadata", "AWS_REGION=us-west-2"]
# # Narrow this to specific variables to keep unrelated AWS_* secrets
# # (for example AWS_BEARER_TOKEN) away from the plugin.
# inherit_env = ["AWS_*", "HOME"]
# dirs = ["~/.aws"]
# scope = "session"

# Remote servers: owlet connects as a client; clients of owlet still use plain JSON.
# `scope` may be "shared" or "session" (not "project").

# Streamable HTTP (default transport for `url`).
[servers.remote]
url = "https://mcp.example.com/mcp"
headers = { Authorization = "Bearer upstream-token" }

# Legacy HTTP+SSE (2024-11-05); `url` is the SSE stream endpoint.
[servers.legacy-remote]
url = "http://127.0.0.1:9000/sse"
transport = "sse"
headers = { Authorization = "Bearer upstream-token" }

# Strong per-client state: one process per session, stopped on DELETE.
# `enabled = false` keeps the entry but rejects clients until `owlet enable playwright`.
[servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
scope = "session"
enabled = false
idle_timeout = 300
cache_lists = true
