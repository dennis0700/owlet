[package]
name = "owlet-gpui"
version = "0.1.0"
edition = "2021"

# Deliberately empty so that `cargo build`/`cargo test` run from the repo root
# (where `owlet`'s Cargo.toml has no [workspace] table) do not pull this crate
# in as a workspace member. Mirrors the approach used by ui/src-tauri. This
# sandbox has no network access, so the lockfiles are resolved independently
# against whatever is already in the offline registry cache; merging into a
# root workspace would force the root package's rust-version (1.89) up to
# gpui-kit's newer toolchain requirement, which is an unrelated, visible
# change this feature does not make. See FEAT-001 `findings` for the full
# reasoning.
#
# `resolver = "2"` is required (not merely nice-to-have): an empty [workspace]
# table otherwise defaults to the v1 feature resolver, which unifies features
# across target-specific dependencies. gpui-kit-assets pulls in its reqwest
# stack only under `cfg(target_family = "wasm")`, and under v1 that wasm-only
# reqwest would still switch on `hyper/http2` for the native build, dragging in
# the `h2` crate. `h2`'s `.crate` archive is absent from this sandbox's offline
# registry cache, so the native build would fail trying to download it. The v2
# resolver scopes those wasm-only features to the wasm target, so `h2` is never
# requested for the native build.
[workspace]
resolver = "2"

[[bin]]
name = "owlet-gpui"
path = "src/main.rs"

[dependencies]
owlet = { path = "../.." }

# Pinned to the newest version available in the offline registry cache
# (/Volumes/Zhitai/.cargo/registry/cache); 0.8.0 is not cached and cannot be
# fetched in this sandbox. Default features (component + assets) are used.
# gpui-kit re-exports gpui/gpui-base/gpui-component/assets through
# `use gpui_kit::*;`, so no separate gpui* dependency is declared.
gpui-kit = "=0.7.3"

anyhow = "1.0.104"
axum = "0.8.9"
parking_lot = "0.12.5"
tokio = { version = "1.53.2", features = ["net", "rt", "rt-multi-thread", "sync", "time"] }

# The check-only updater talks to the GitHub Releases API. Versions pinned to
# what the owlet dependency already resolves in this crate's lockfile; matching
# owlet's `reqwest` feature set (default-features off + rustls) keeps the
# dependency graph unchanged. `stream` is unified in by owlet, so it is not
# requested here.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "io-util"] }
