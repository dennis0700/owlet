[package]
name = "owlet-ui"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "Desktop UI for managing owlet MCP servers"

[[bin]]
name = "owlet"
path = "src/main.rs"

[lib]
name = "owlet_ui"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
owlet = { path = "../.." }
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-updater = "2.12.0"
tokio = { version = "1.53.2", features = ["net", "rt", "sync", "time"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = ["codegen"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "io-util"] }
